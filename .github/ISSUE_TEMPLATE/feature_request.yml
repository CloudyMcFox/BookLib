name: Feature request
description: Suggest an improvement to BookLib.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would like BookLib to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Docker or deployment
        - Backend API
        - Web frontend
        - Documentation
        - Other
    validations:
      required: true
