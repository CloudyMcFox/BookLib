services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8882}:8882"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      BOOKLIB_DB: /data/books.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = call the same origin the UI is served from (reverse proxy setup).
        # Otherwise set VITE_API_BASE in .env, e.g. https://api.example.com
        VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3006}:80"
    depends_on:
      - backend
    restart: unless-stopped
