server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    location ~ ^/(health|token|auth|me|books|tags|series|formats|shelves|search|lookup|edition|diagnostics)(/|$) {
        proxy_pass http://backend:8882;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached so that
    # a redeploy is picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
